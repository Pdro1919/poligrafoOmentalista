<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentalista</title>
    <link rel="stylesheet" href="poligrafo.css">
</head>
<body>
 
    <div class="jogo">
 
        <h1>Detector de Mentiras</h1>
        <p>Responda às perguntas da investigação!</p>
 
        <div class="cenario">
 
            <div class="balao" id="pergunta">
                Vamos começar o interrogatório?
            </div>
 
            <img src="poligrafo.png" alt="Interrogatório">
 
        </div>
 
        <h3 id="numero">Pergunta 1 de 6</h3>
 
        <select id="resposta">
            <option value="">Selecione sua resposta</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        </select>
 
        <button onclick="responder()">Responder</button>
 
        <h2 id="resultado"></h2>
 
        <button id="reiniciar" onclick="reiniciarJogo()">
            Reiniciar
        </button>
 
    </div>
 
    <script src="poligrafo.js"></script>
</body>
</html>
